  // floor: black/grey checker, 0.6m tile
  let [c,x]=mk(128,128);x.fillStyle='#8a8794';x.fillRect(0,0,128,128);x.fillStyle='#2a2830';x.fillRect(0,0,64,64);x.fillRect(64,64,64,64);
  x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;x.strokeRect(0,0,128,128);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(4,LEN+2),new THREE.MeshLambertMaterial({map:tex(c,[4/.6,(LEN+2)/.6])}));
  floor.rotation.x=-Math.PI/2;floor.position.set(0,0,(Z0+ZN)/2);scene.add(floor);
  // ceiling tiles
  [c,x]=mk(128,128);x.fillStyle='#3b3944';x.fillRect(0,0,128,128);x.strokeStyle='#1c1b22';x.lineWidth=3;x.strokeRect(0,0,128,128);
  for(let i=0;i<60;i++){x.fillStyle='rgba(0,0,0,.12)';x.fillRect(R()*128,R()*128,2,2)}
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(4,LEN+2),new THREE.MeshLambertMaterial({map:tex(c,[4/.6,(LEN+2)/.6])}));
  ceil.rotation.x=Math.PI/2;ceil.position.set(0,3,(Z0+ZN)/2);scene.add(ceil);
  // light panels
  const lm=new THREE.MeshBasicMaterial({color:0xfff1dc});
  for(let z=Z0-1;z>ZN;z-=2.6)for(const x0 of[-.75,.75]){const m=new THREE.Mesh(new THREE.BoxGeometry(.4,.05,1.1),lm);m.position.set(x0,2.97,z);scene.add(m)}
  // pegboard wall
  [c,x]=mk(64,64);x.fillStyle='#6b6a58';x.fillRect(0,0,64,64);x.fillStyle='#2b2a22';
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.beginPath();x.arc(16+i*32,16+j*32,3,0,7);x.fill()}
  const pegTex=tex(c,[LEN/.25,3/.25]);const pegMat=new THREE.MeshLambertMaterial({map:pegTex});
  const metal=new THREE.MeshLambertMaterial({color:0x17131c});
  for(const s of[-1,1]){
    const wall=new THREE.Mesh(new THREE.BoxGeometry(.04,3,LEN),pegMat);wall.position.set(s*1.78,1.5,(Z0+ZN)/2);scene.add(wall);
    for(let r=0;r<5;r++){const p=new THREE.Mesh(new THREE.BoxGeometry(.36,.024,LEN),metal);p.position.set(s*1.59,.22+r*.43-.012,(Z0+ZN)/2);scene.add(p)}
    for(let z=Z0;z>ZN;z-=1.2){const u=new THREE.Mesh(new THREE.BoxGeometry(.36,2.25,.03),metal);u.position.set(s*1.59,1.1,z);scene.add(u)}
    const base=new THREE.Mesh(new THREE.BoxGeometry(.36,.12,LEN),metal);base.position.set(s*1.59,.06,(Z0+ZN)/2);scene.add(base);
    // genre banners above the shelves
    BANNERS.forEach(([name,col],i)=>{
      const [bc,bx]=mk(1024,240);bx.fillStyle=col;bx.fillRect(0,0,1024,240);
      bx.fillStyle='rgba(0,0,0,.28)';bx.fillRect(0,0,1024,14);bx.fillRect(0,226,1024,14);
      bx.fillStyle='#fff';bx.font='170px '+DISP;bx.textAlign='center';bx.textBaseline='middle';bx.fillText(name,512,128);
      const m=new THREE.Mesh(new THREE.PlaneGeometry(2.35,.55),new THREE.MeshBasicMaterial({map:tex(bc),color:0xd0d0d0}));
      m.rotation.y=s<0?Math.PI/2:-Math.PI/2;
      const idx=(i+(s<0?0:3))%BANNERS.length;
      m.position.set(s*1.4,2.52,Z0-.3-i*2.45-(s<0?0:1.2));scene.add(m);
      void idx;
    });
  }
  // hanging signs
  ['NEW IN','BKASH \u2022 NAGAD','WHATSAPP SUPPORT','DIGITAL DELIVERY','NMS TECH BANGLA'].forEach((t,i)=>{
    const [sc,sx]=mk(512,160);sx.fillStyle='#f2efe6';sx.fillRect(0,0,512,160);sx.strokeStyle='#c8202c';sx.lineWidth=10;sx.strokeRect(8,8,496,144);
    sx.fillStyle='#c8202c';sx.font='92px '+DISP;sx.textAlign='center';sx.textBaseline='middle';sx.fillText(t,256,84);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.375),new THREE.MeshBasicMaterial({map:tex(sc),color:0xcfcfcf,side:THREE.DoubleSide}));
    m.position.set(i%2?-.35:.35,2.55,-1.8-i*3.6);scene.add(m);
    const rod=new THREE.Mesh(new THREE.BoxGeometry(.01,.45,.01),metal);rod.position.set(m.position.x,2.8,m.position.z);scene.add(rod);
  });
  // exit sign at the far end
  const [ec,ex]=mk(256,96);ex.fillStyle='#240006';ex.fillRect(0,0,256,96);ex.fillStyle='#ff3b3b';ex.font='80px '+DISP;ex.textAlign='center';ex.textBaseline='middle';ex.fillText('EXIT',128,52);
  const exit=new THREE.Mesh(new THREE.PlaneGeometry(.7,.26),new THREE.MeshBasicMaterial({map:tex(ec)}));exit.position.set(0,2.55,ZN+.1);scene.add(exit);
})();

// featured placement
const PITCH=.062,ROWS=5,plankY=r=>.22+r*.43;
const F_D=.19,F_H=.34,F_T=.075;
const blocked=new Set();
const feats=ITEMS.map((it,i)=>{
  const side=i%2?1:-1,row=i%4<2?2:3,z=-1.2-i*1.15;
  const slot=Math.round((Z0-z)/PITCH);
  blocked.add(side+'|'+row+'|'+slot);blocked.add(side+'|'+row+'|'+(slot+1));
  return Object.assign(it,{side,row,z:Z0-slot*PITCH-PITCH/2,idx:i});
});

// background tapes (one draw call)
(function crowd(){
  const [c,x]=mk(64,256);x.fillStyle='#d6d3dc';x.fillRect(0,0,64,256);
  x.fillStyle='#f6f4f9';x.fillRect(8,18,48,82);x.fillStyle='#5a5666';for(let i=0;i<5;i++)x.fillRect(12,26+i*13,40,3);
  x.fillStyle='#4a4656';x.fillRect(0,120,64,16);x.fillRect(0,220,64,10);x.fillStyle='#ffffff';x.fillRect(20,150,24,50);
  const pal=['#1d1d26','#1d1d26','#2c2c3a','#b3202a','#1f3f8f','#d9a21b','#e9e6dc','#e0661f','#1a7f7a','#6a2b8f','#25272e','#8a2a46'];
  const slots=Math.floor(LEN/PITCH);
  const geo=new THREE.BoxGeometry(.17,.3,.055);
  const mat=new THREE.MeshLambertMaterial({map:tex(c)});
  const inst=new THREE.InstancedMesh(geo,mat,2*ROWS*slots);
  const d=new THREE.Object3D(),col=new THREE.Color();let n=0;
  for(const side of[-1,1])for(let r=0;r<ROWS;r++)for(let s=0;s<slots;s++){
    if(blocked.has(side+'|'+r+'|'+s)||R()<.05)continue;
    const sy=.9+R()*.16,z=Z0-s*PITCH-PITCH/2;
    d.position.set(side*1.5+(R()-.5)*.02,plankY(r)+.15*sy,z);d.scale.set(1,sy,1);d.rotation.y=side<0?0:Math.PI;d.updateMatrix();
    inst.setMatrixAt(n,d.matrix);col.set(pal[Math.floor(R()*pal.length)]).multiplyScalar(.75+R()*.5);inst.setColorAt(n,col);n++;
  }
  inst.count=n;scene.add(inst);
})();

// featured, clickable tapes
function makeTape(it,side){
  const dark=()=>new THREE.MeshLambertMaterial({color:0x17131c});
  const spine=new THREE.MeshLambertMaterial({map:tex(it._spine||(it._spine=drawSpine(it)))});
  const cover=new THREE.MeshLambertMaterial({map:tex(it._cover||(it._cover=drawCover(it)))});
  const back=new THREE.MeshLambertMaterial({map:tex(it._back||(it._back=drawBack(it)))});
  const mats=side<0?[spine,dark(),dark(),dark(),cover,back]:[dark(),spine,dark(),dark(),cover,back];
  return new THREE.Mesh(new THREE.BoxGeometry(F_D,F_H,F_T),mats);
}
function setGlow(m,v){(Array.isArray(m.material)?m.material:[m.material]).forEach(k=>k.emissive&&k.emissive.setRGB(v*.5,v*.12,v*.45))}
const meshes=[];

/* ---------- UI wiring ---------- */
const $=id=>document.getElementById(id);
const stage=$('stage'),tip=$('tip'),panel=$('panel'),nav=$('nav');
let curZ=3.4,targetZ=1.2,yawS=0,pitchS=0,dragYaw=0,mx=0,my=0,pd=null,hover=null,cur=null,flyer=null,ft=0,ftT=0,orig=null,pendingOpen=null,walk=0;
const pointer={x:0,y:0};

function buildScene(){
  feats.forEach(it=>{
    const m=makeTape(it,it.side);
    const bx=it.side*1.49;
    m.position.set(bx,plankY(it.row)+F_H/2,it.z);
    m.userData={item:it,baseX:bx,hv:0};scene.add(m);meshes.push(m);
    const b=document.createElement('button');b.type='button';b.textContent=String(it.idx+1).padStart(2,'0');b.title=it.bn;b.setAttribute('aria-label',it.bn+' দেখুন');
    b.onclick=()=>walkTo(m);nav.appendChild(b);
  });
}
function walkTo(m){if(cur)return;targetZ=clamp(m.position.z+2.1,ZN+4,Z0);pendingOpen=m}
const ray=new THREE.Raycaster();
function pick(cx,cy){
  ray.setFromCamera(new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1),cam);
  const h=ray.intersectObjects(meshes,false);return h.length?h[0].object:null}

function openItem(m){
  if(cur)return;cur=m;const it=m.userData.item;
  flyer=makeTape(it,it.side);flyer.position.copy(m.position);flyer.quaternion.copy(m.quaternion);scene2.add(flyer);
  orig={p:m.position.clone(),q:m.quaternion.clone()};m.visible=false;ftT=1;pendingOpen=null;
  $('pKick').textContent='TAPE No. '+String(it.idx+1).padStart(3,'0')+' • '+it.genre.toUpperCase();
  $('pTitle').textContent=it.bn;$('pTag').textContent=it.tagBn;$('pOrder').href=it.url;$('pDesc').textContent=it.desc;
  $('pMeta').innerHTML=[['ক্যাটাগরি',it.genre],['ডেলিভারি','ডিজিটাল'],['পেমেন্ট','bKash / Nagad'],['সাপোর্ট','WhatsApp'],['দাম','অর্ডার পেজে দেখুন']].map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('');
  document.body.classList.add('open');tip.classList.remove('on');
}
function closeItem(){if(!cur)return;ftT=0;panel.classList.remove('show');document.body.classList.remove('open')}
$('pClose').onclick=closeItem;
addEventListener('keydown',e=>{
  if(e.key==='Escape')closeItem();
  if(cur)return;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')targetZ=clamp(targetZ-.7,ZN+4,Z0);
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')targetZ=clamp(targetZ+.7,ZN+4,Z0);
});
stage.addEventListener('wheel',e=>{e.preventDefault();if(!cur){pendingOpen=null;targetZ=clamp(targetZ-e.deltaY*.006,ZN+4,Z0)}},{passive:false});
stage.addEventListener('pointerdown',e=>{pd={lx:e.clientX,ly:e.clientY,moved:0};try{stage.setPointerCapture(e.pointerId)}catch(_){}});
stage.addEventListener('pointermove',e=>{
  mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;pointer.x=e.clientX;pointer.y=e.clientY;
  if(pd){const dx=e.clientX-pd.lx,dy=e.clientY-pd.ly;pd.lx=e.clientX;pd.ly=e.clientY;pd.moved+=Math.abs(dx)+Math.abs(dy);
    if(!cur&&pd.moved>8){pendingOpen=null;targetZ=clamp(targetZ+dy*.02,ZN+4,Z0);dragYaw=clamp(dragYaw+dx*.004,-.9,.9)}}
  else if(e.pointerType==='mouse'&&!cur){hover=pick(e.clientX,e.clientY);updateTip()}
});
stage.addEventListener('pointerup',e=>{
  if(!pd)return;const tap=pd.moved<8;pd=null;
  if(!tap)return;
  if(cur){closeItem();return}
  const m=pick(e.clientX,e.clientY);if(m)openItem(m);
});
stage.addEventListener('pointerleave',()=>{hover=null;updateTip()});
function updateTip(){
  stage.classList.toggle('hot',!!hover);
  if(hover&&!cur){tip.textContent=hover.userData.item.bn;tip.style.left=Math.min(pointer.x+16,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(pointer.y+16)+'px';tip.classList.add('on')}
  else tip.classList.remove('on')}

/* ---------- loop ---------- */
const eul=new THREE.Euler(),tq=new THREE.Quaternion(),tp=new THREE.Vector3(),off=new THREE.Vector3(),q2=new THREE.Quaternion(),tc=$('tc');
let last=performance.now(),t0=last,lastTc=-1;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;const time=(now-t0)/1000;
  // walking
  const pz=curZ;curZ+=(targetZ-curZ)*(1-Math.exp(-dt*4));const vel=Math.abs(curZ-pz)/Math.max(dt,.001);
  walk+=vel*dt*5;
  if(pendingOpen&&Math.abs(curZ-targetZ)<.12){openItem(pendingOpen)}
  if(!pd)dragYaw*=Math.exp(-dt*.8);
  const ty=-(mx*.5)-dragYaw*0+(-dragYaw),tpch=-my*.16;
  yawS+=(ty-yawS)*(1-Math.exp(-dt*5));pitchS+=(tpch-pitchS)*(1-Math.exp(-dt*5));
  const bob=RM?0:Math.sin(walk)*Math.min(vel,1.5)*.012;
  cam.position.set(Math.sin(walk*.5)*Math.min(vel,1.5)*.01,1.38+bob,curZ);
  cam.rotation.set(pitchS,yawS,0,'YXZ');
  cam.updateMatrixWorld();
  // hover nudge
  for(const m of meshes){const u=m.userData;const on=m===hover&&!cur;
    u.hv+=((on?1:0)-u.hv)*(1-Math.exp(-dt*12));m.position.x=u.baseX-Math.sign(u.baseX)*.07*u.hv;setGlow(m,u.hv)}
  // flyer
  if(cur){
    r2._dirty=true;const dur=RM?.25:.9;ft=clamp(ft+(ftT?1:-1)*dt/dur,0,1);const e=ease(ft);
    cam2.position.copy(cam.position);cam2.quaternion.copy(cam.quaternion);cam2.updateMatrixWorld();
    const portrait=innerWidth/innerHeight<1;const dist=.62;
    const vH=2*dist*Math.tan(THREE.MathUtils.degToRad(cam.fov/2)),vW=vH*cam.aspect;
    let s=portrait?Math.min(.44*vH/F_H,.62*vW/F_D):.66*vH/F_H;
    off.set(portrait?0:-.2*vW,portrait?.17*vH:0,-dist).applyQuaternion(cam.quaternion);
    tp.copy(cam.position).add(off);
    const tiltY=(mx*.55+Math.sin(time*.9)*.1),tiltX=-my*.3;
    q2.setFromEuler(eul.set(tiltX,tiltY-.15,0,'YXZ'));tq.copy(cam.quaternion).multiply(q2);
    flyer.position.lerpVectors(orig.p,tp,e);flyer.position.y+=Math.sin(e*Math.PI)*.09;
    flyer.quaternion.slerpQuaternions(orig.q,tq,e);flyer.scale.setScalar(1+(s-1)*e);
    if(ft>.55&&ftT===1)panel.classList.add('show');
    if(ft<=0&&ftT===0){scene2.remove(flyer);flyer.geometry.dispose();flyer=null;cur.visible=true;cur=null;hover=null}
    r2.render(scene2,cam2);
  }else if(r2._dirty){r2.clear();r2._dirty=false}
  r1.render(scene,cam);
  const sec=Math.floor(time)+26;if(sec!==lastTc){lastTc=sec;tc.textContent='SP 0:'+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
}

const fontsReady=Promise.race([Promise.all([document.fonts.load('60px "Bebas Neue"'),document.fonts.load('16px "Share Tech Mono"')]),new Promise(r=>setTimeout(r,1800))]).catch(()=>{});
fontsReady.then(()=>{resize();buildScene();requestAnimationFrame(frame)});
</script>
